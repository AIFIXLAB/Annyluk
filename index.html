<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anny Finance">

<title>AnnyLuk Finance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F0FF;--ink:#3B2F5C;--mut:#6E6392;--pri:#7457C2;--soft:#E4D6FA;--line:#EFE7FB;--pink:#FCE8F3;--neg:#B0407E;--pos:#2F7D5B}
@media(prefers-color-scheme:dark){:root{--bg:#1E1830;--ink:#F0E9FF;--mut:#B6A9D6;--pri:#9B82E6;--soft:#3A2F5C;--line:#32284F;--pink:#3A2440;--neg:#F08CBD;--pos:#7ED3AA}.card,.sheet,input,select{background:#2A2142!important}button.pri{color:#1E1830!important}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali',sans-serif}
body{padding:calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
h1,h2{margin:0}h2{font-size:17px;margin:18px 0 8px}
.card{background:#fff;border-radius:20px;padding:6px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.mut{color:var(--mut);font-size:13px}.b{font-weight:600}
button{font-family:inherit;min-height:46px;border:0;border-radius:16px;padding:0 14px;font-size:15px;background:#fff;color:var(--pri);font-weight:600;cursor:pointer}
button.pri{background:var(--pri);color:#fff}button.ghost{background:transparent;border:1.5px solid var(--soft)}button.del{background:transparent;color:var(--neg);border:1.5px solid var(--soft)}
.chip{border-radius:22px;background:var(--soft);min-height:44px}.chip.on{background:var(--pri);color:#fff}
input,select{width:100%;min-height:46px;border:1.5px solid var(--soft);border-radius:14px;padding:0 12px;font:inherit;font-size:16px;background:#FBF8FF;color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:10px}
.hero{background:var(--pri);color:#fff;border-radius:24px;padding:20px;margin:14px 0}
.hero .n{font-size:32px;font-weight:600}.btns{display:flex;gap:8px}.btns button{flex:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:#B79CF0}
#ov{position:fixed;inset:0;background:rgba(40,25,70,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.chips .chip{padding:0 6px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(20px + env(safe-area-inset-bottom));min-height:56px;border-radius:28px;background:var(--pri);color:#fff;box-shadow:0 6px 18px rgba(80,50,150,.35);z-index:5;padding:0 22px;font-size:16px}
.note{background:var(--pink);border-radius:18px;padding:12px 14px;font-size:13px;color:var(--mut);margin:12px 0}.lk{color:var(--pri);font-size:13px;text-decoration:underline}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;margin:0;padding:0;border:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:#cfc3ea;border-radius:14px;transition:.2s}.sw i:before{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--pri)}.sw input:checked+i:before{transform:translateX(18px)}.off{opacity:.55}
.hf{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.hf .chip{min-height:40px;font-size:14px;padding:0 14px}
.bdg{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--neg);color:#fff;font-size:12px;line-height:20px;margin-left:4px}
.scr{overflow-x:auto;-webkit-overflow-scrolling:touch}.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}.tbl th{background:var(--soft);padding:8px 8px;text-align:right;font-weight:600;white-space:nowrap}.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:#fff}.tbl th:first-child{background:var(--soft)}.tbl tr.tot td{font-weight:600;border-top:2px solid var(--soft)}
.mbox{background:#fff;border-radius:16px;padding:12px 10px;text-align:center}.mbox .t{font-size:12px;color:var(--mut)}.mbox .v{font-size:17px;font-weight:600;margin-top:4px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sec{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0 8px}.sec button{min-height:38px;font-size:14px;background:var(--soft)}.err{color:var(--neg);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const SB_URL='https://etqgjkeyoxgfncphtiao.supabase.co';
const SB_KEY='sb_publishable_adz6BHqdK99sKdBnJsNk-g_PRRhpYTj';
const TL={income:'รายรับ',expense:'รายจ่าย',transfer:'โอน',card_purchase:'รูดบัตร',card_payment:'ชำระบัตรเครดิต',security_buy:'ซื้อหุ้น/กองทุน',security_sell:'ขายหุ้น/กองทุน',gold_buy:'ซื้อทองคำ',gold_sell:'ขายทองคำ',fx_buy:'แลกเงินตราต่างประเทศ (เก็บไว้)',fx_sell:'แลกเงินตราต่างประเทศกลับเป็นบาท'};
const AT={deposit:'เงินฝาก',card:'บัตรเครดิต',securities:'หุ้น/กองทุน',other:'อื่นๆ'};
let sb,A=[],T=[],L=[],SL=[],PR=[],IP=[],II=[],TKS=[],IMP=[],PS=[],SET={},FS=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'฿'+Math.abs(Number(n)).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdt=d=>new Date(d).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const nm=id=>{const a=A.find(x=>x.id===id);return a?a.nickname:'(บัญชีที่ลบแล้ว)'};
async function q(p){const r=await p;if(r.error){alert('ผิดพลาด: '+r.error.message);throw r.error}return r.data}
function openSheet(h){$('sheet').innerHTML=h;$('ov').style.display='flex'}
function closeSheet(){$('ov').style.display='none';window._edit=null}
function bal(a){let b=Number(a.opening_balance);for(const t of T){if(t.to_account_id===a.id)b+=Number(t.amount);if(t.from_account_id===a.id)b-=Number(t.amount)}return b}

async function init(){
  if(!window.supabase){$('app').innerHTML='<p class="err">โหลดระบบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p>';return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const{data}=await sb.auth.getSession();
  data.session?load():loginView();
}
function loginView(){
  $('app').innerHTML=`<h1 style="margin-top:40px">AnnyLuk Finance</h1><p class="mut">เข้าสู่ระบบเพื่อดูบัญชีของคุณ</p>
  <div class="card" style="padding:18px"><label>อีเมล<input id="em" type="email" autocomplete="username"></label>
  <label>รหัสผ่าน<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="err" id="le"></div><button class="pri" style="width:100%" onclick="login()">เข้าสู่ระบบ</button></div>`;
}
async function login(){
  const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error){$('le').textContent='เข้าสู่ระบบไม่สำเร็จ: '+error.message;return}
  load();
}
async function logout(){await sb.auth.signOut();A=[];T=[];loginView()}
async function load(){
  A=await q(sb.from('accounts').select('*').is('deleted_at',null).order('display_order'));
  T=await q(sb.from('transactions').select('*').is('deleted_at',null).order('occurred_at',{ascending:false}));
  L=await q(sb.from('security_lots').select('*'));SL=await q(sb.from('security_sales').select('*'));PR=await q(sb.from('security_prices').select('*'));IP=await q(sb.from('installment_plans').select('*').order('created_at'));II=await q(sb.from('installment_items').select('*'));
  const tk=await sb.from('tasks').select('*').is('deleted_at',null);TKS=tk.error?[]:tk.data;
  const im=await sb.from('important_dates').select('*').is('deleted_at',null);IMP=im.error?[]:im.data;
  await loadSnaps();
  const fs=await sb.from('fx_spends').select('*');FS=fs.error?[]:fs.data;
  const st=await sb.from('app_settings').select('*');SET={};(st.error?[]:st.data).forEach(r=>{SET[r.key]=r.value});
  home();
}
function cardRow(a){const b=bal(a),used=Math.max(0,-b),lim=Number(a.credit_limit||0),ps=IP.filter(p=>p.card_account_id===a.id);
  const pl=ps.length?`<div class="mut">ผ่อนอยู่ ${ps.length} รายการ · ต่องวดรวม ${fmt(ps.reduce((t,p)=>{const st=planStat(p);return t+(st.remain>0?st.per:0)},0))} · เหลือรวม ${fmt(ps.reduce((t,p)=>t+planStat(p).remain,0))}</div>`:'';
  return `<div class="row${a.exclude_from_total?' off':''}" style="align-items:flex-start"><div><div>${esc(a.nickname)}${a.exclude_from_total?' <span class="mut">· ไม่รวมในยอดรวม</span>':''}</div>${lim?`<div class="mut">ใช้ไป ${fmt(used)} จากวงเงิน ${fmt(lim)} · เหลือ ${fmt(lim-used)}</div>`:'<div class="mut">ยังไม่ได้ตั้งวงเงิน</div>'}${pl}<a href="#" class="lk" onclick="setLimit('${a.id}');return false">แก้ไขวงเงิน</a> · <a href="#" class="lk" onclick="openPlans('${a.id}');return false">แสดงรายการผ่อนชำระ${ps.length?' ('+ps.length+')':''}</a><div style="margin-top:6px"><button class="ghost" style="min-height:36px;font-size:13px" onclick="openCardHist('${a.id}')">ดูประวัติรูดบัตร</button></div></div><span style="display:flex;align-items:center;gap:10px"><span class="b">${fmt(b)}</span>${sw(a)}</span></div>`}
async function setLimit(id){const a=A.find(x=>x.id===id),v=prompt('วงเงินของ '+a.nickname+' (บาท)',a.credit_limit||'');if(v===null)return;
  const n=Number(v);if(!(n>=0)){alert('ใส่ตัวเลขวงเงิน');return}await q(sb.from('accounts').update({credit_limit:n}).eq('id',id));load()}
function home(){window._view='home';
  const non=A.filter(a=>a.account_type!=='card'),cards=A.filter(a=>a.account_type==='card');
  const nEx=A.filter(a=>a.exclude_from_total).length,tot=non.filter(a=>!a.exclude_from_total).reduce((s,a)=>s+bal(a),0),debt=cards.filter(a=>!a.exclude_from_total).reduce((s,a)=>s+Math.min(0,bal(a)),0);
  const groups={};A.forEach(a=>{const k=a.institution||'อื่นๆ';(groups[k]=groups[k]||[]).push(a)});
  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><button class="ghost" aria-label="เมนู" onclick="openMenu()" style="font-size:20px;padding:0 14px">☰${notifyEntries().length?`<span class="bdg">${notifyEntries().length}</span>`:''}</button><div style="flex:1"><h1>AnnyLuk Finance</h1><div class="mut">ภาพรวมบัญชี · ข้อมูลจริงจาก Supabase</div></div><button class="ghost" onclick="logout()">ออก</button></div>
  <div class="note">ยอดที่แสดงคือผลรวมจากรายการที่บันทึกในระบบนี้เท่านั้น ยังไม่ผ่านการกระทบยอดกับ statement จริง ตอนนี้รองรับ รายรับ / รายจ่าย / โอน / รูดบัตร / หุ้น-กองทุน ทองคำ เงินตราต่างประเทศ และผ่อนชำระ</div>
  <div class="hero"><div style="opacity:.9;font-size:14px">ยอดรวมบัญชีที่ไม่ใช่บัตร${nEx?` (ไม่รวม ${nEx} บัญชี)`:''}</div><div class="n">${fmt(tot)}</div><div style="font-size:13px;opacity:.9">หนี้บัตรเครดิตรวม ${fmt(-debt)}</div><div style="font-size:13px;opacity:.9">มูลค่าสินทรัพย์ลงทุน (${portLabel()}) ตามราคาล่าสุด ${fmt(portfolioTotal())}</div></div>
  ${notifyHTML()}${countdownHTML()}${staleBanner()}<div class="sec"><h2 style="margin:0">บัญชี</h2><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button onclick="openManage()">จัดการบัญชี</button><button onclick="openDay()">สรุปรายวัน</button><button onclick="openMonth()">สรุปรายเดือน</button></div></div><div class="mut" style="margin:-2px 0 4px">สวิตช์ท้ายแต่ละบัญชี: เปิด = นับรวมในยอดรวม · ปิด = ไม่รวม</div>`;
  if(!A.length)h+='<div class="card"><p class="mut">ยังไม่มีบัญชี กด "จัดการบัญชี" เพื่อเพิ่ม</p></div>';
  for(const g in groups){h+=`<div class="mut" style="margin:12px 0 4px">${esc(g)}</div><div class="card">`+groups[g].map(a=>a.account_type==='card'?cardRow(a):`<div class="row${a.exclude_from_total?' off':''}"><div>${esc(a.nickname)}${a.exclude_from_total?' <span class="mut">· ไม่รวมในยอดรวม</span>':''}${fxLines(a)}</div><span style="display:flex;align-items:center;gap:10px"><span class="b">${fmt(bal(a))}</span>${sw(a)}</span></div>`).join('')+'</div>'}
  h+=portfolioHTML('security')+portfolioHTML('gold')+portfolioHTML('fx');
  const hist=HD?T.filter(t=>new Date(t.occurred_at)>=dayStart(HD)):T.slice(0,50);
  const hi=hist.filter(t=>t.txn_type==='income').reduce((c,t)=>c+Number(t.amount),0),he=hist.filter(t=>t.txn_type==='expense'||t.txn_type==='card_purchase').reduce((c,t)=>c+Number(t.amount),0);
  h+=`<h2>ประวัติล่าสุด</h2><div class="hf">${[[0,'ล่าสุด'],[1,'1 วัน'],[7,'7 วัน'],[15,'15 วัน'],[30,'30 วัน']].map(([d,l])=>`<button class="chip${HD===d?' on':''}" onclick="setHD(${d})">${l}</button>`).join('')}</div>${HD?`<div class="mut" style="margin-bottom:8px">ย้อนหลัง ${HD} วัน (นับรวมวันนี้) · ${hist.length} รายการ · รายรับ ${fmt(hi)} · รายจ่าย ${fmt(he)}</div>`:''}<div class="card">`;
  h+=hist.length?hist.map(t=>{const inn=isIn(t);
    return `<div class="row" onclick="openSlip('${t.id}')" style="cursor:pointer"><div><div>${TL[t.txn_type]}${t.category?' · '+esc(t.category):''}${t.owner?' · '+esc(t.owner):''}${fxTag(t)}</div><div class="mut">${fdt(t.occurred_at)}</div></div><span class="b" style="color:${inn?'var(--pos)':t.txn_type==='transfer'?'var(--ink)':'var(--neg)'}">${t.txn_type==='transfer'?'':inn?'+':'-'}${fmt(t.amount)}</span></div>`}).join(''):`<p class="mut">${HD?'ไม่มีรายการในช่วงนี้':'ยังไม่มีรายการ กด "+ เพิ่มรายการ" เพื่อเริ่มบันทึก'}</p>`;
  $('app').innerHTML=h+'</div><button class="fab" onclick="openAdd(\'expense\')">+ เพิ่มรายการ</button>';
}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function opts(list,sel){return '<option value="">เลือกบัญชี</option>'+list.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.nickname)}</option>`).join('')}
function openAdd0(type){
  const cards=A.filter(a=>a.account_type==='card'),non=A.filter(a=>a.account_type!=='card');
  const ORDER=['income','expense','transfer','card_payment','card_purchase','security_buy','security_sell','gold_buy','gold_sell','fx_buy','fx_sell'];
  const chips=`<label>ประเภทรายการ<select onchange="openAdd(this.value)"${window._edit?' disabled':''}>${ORDER.map(k=>`<option value="${k}"${k===type?' selected':''}>${TL[k]}</option>`).join('')}</select></label>`;
  let f='';
  if(type==='income')f=`<label>บัญชีที่รับเข้า<select id="to">${opts(A)}</select></label>`;
  if(type==='expense')f=expenseForm();
  if(type==='transfer')f=`<label>จากบัญชี<select id="from">${opts(A)}</select></label><label>ไปบัญชี (จ่ายบัตรคืน เลือกบัตรตรงนี้)<select id="to">${opts(A)}</select></label>`;
  if(type==='card_purchase')f=`<label>บัตรที่รูด<select id="from">${opts(cards)}</select></label>
  <div class="row" style="border:0;padding:4px 0 10px"><span>ผ่อนชำระ</span><span class="sw"><input type="checkbox" id="inst" aria-label="ผ่อนชำระ" onchange="toggleInst()"><i></i></span></div>
  <div id="instbox" style="display:none"><div class="mut" style="margin-bottom:8px">ช่อง "จำนวนเงิน" ด้านล่าง = ราคา/ยอดเต็มของสินค้า ยอดบัตรจะเพิ่มทีละงวดเมื่อกด "จ่ายแล้ว" ในรายการผ่อนชำระ</div>
  <label>ชื่อสินค้า<input id="ipn"></label><label>จำนวนงวด (เดือน)<input id="ipm" type="number" inputmode="numeric" oninput="instCalc()"></label>
  <label>ยอดผ่อนต่องวด (บาท คำนวณให้ แก้ได้ถ้ามีดอกเบี้ย)<input id="ipe" type="number" step="0.01" inputmode="decimal" oninput="this.dataset.m=1"></label>
  <label>วันครบกำหนดงวดแรก<input id="ipd" type="date" value="${nextMonth()}"></label></div>`;
  if(type==='card_payment')f=`<label>บัญชีต้นทาง (จ่ายจาก)<select id="from">${opts(non)}</select></label><label>บัตรเครดิตที่ชำระ<select id="to">${opts(cards)}</select></label>`;
  const tf=typeForm(type);if(tf)f=tf;
  window._type=type;const sec=/^(security|gold|fx)_/.test(type);
  openSheet(`<h2 style="margin-top:0">${window._edit?'แก้ไขรายการ':'เพิ่มรายการ'}</h2>${chips}${f}
  <label>${type.endsWith('_buy')?'ยอดที่จ่ายจริง (บาท)':isSellT(type)?'ยอดที่ได้รับ (บาท คำนวณให้)':'จำนวนเงิน (บาท)'}<input id="amt" type="number" inputmode="decimal" step="0.01" min="0" oninput="instCalc();if(window.xcCalc)xcCalc()"${isSellT(type)?' readonly':''}></label>
  ${sec?'':'<label>หมวด / รายละเอียด<input id="cat"></label>'}<label>วันที่-เวลา<input id="dt" type="datetime-local" value="${nowLocal()}"></label>
  <label>เจ้าของ (ไม่บังคับ เช่น ชื่อคนในครอบครัว เว้นว่างได้ถ้าเป็นของกลาง)<input id="own"></label><label>หมายเหตุ (ไม่บังคับ)<input id="note"></label><div class="err" id="fe"></div>
  <button class="pri" style="width:100%" onclick="preview('${type}')">ตรวจสอบก่อนบันทึก</button>${window._edit?`<button class="ghost" style="width:100%;margin-top:8px" onclick="cancelEdit()">ยกเลิกการแก้ไข</button>`:''}`);
}
const GRAM=15.244;
const kindOf=t=>t.startsWith('gold')?'gold':t.startsWith('fx')?'fx':'security';

const isSellT=t=>t.endsWith('_sell');
const stale=d=>!d||Date.now()-new Date(d).getTime()>864e5;
const fdt2=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});

function lotDate(l){const t=T.find(x=>x.id===l.buy_txn_id);return t?t.occurred_at:l.created_at}

function unitLabel(kind,u,sym){u=Number(u);return kind==='gold'?`${u} กรัม (${(u/GRAM).toFixed(4)} บาททอง)`:kind==='fx'?`${u} ${String(sym).replace('FX:','')}`:`${u} หน่วย`}

function priceRow(s){return PR.find(x=>x.symbol===s)}
function fxRate(c){const p=priceRow('FX:'+c)||(c==='USD'?priceRow('USDTHB'):null);return p?Number(p.price):null}
function fxNow(){return fxRate('USD')}
function holdings(kind,inc){const m={};
  for(const l of L){if(lotKind(l)!==kind||SL.some(s=>s.lot_id===l.id)||(inc&&excl(l.holding_account_id)))continue;
    const ru=remU(l);if(ru<=1e-6)continue;const h=m[l.symbol]=m[l.symbol]||{sym:l.symbol,kind,cur:l.currency,units:0,cost:0};h.units+=ru;h.cost+=remC(l)}
  return Object.values(m).map(h=>{const p=priceRow(kind==='gold'?'GOLD':h.sym);h.price=p?Number(p.price):null;h.asof=p?p.as_of:null;let v=null;
    if(h.price!=null){if(kind==='gold')v=h.units/GRAM*h.price;else if(kind==='fx')v=h.units*h.price;else{const fx=h.cur==='USD'?fxNow():1;v=fx!=null?h.units*h.price*fx:null}}
    h.value=v;h.pl=v==null?null:v-h.cost;return h})}
function portfolioTotal(){return['security','gold','fx'].reduce((s,k)=>s+(incl(k)?holdings(k,true).reduce((a,h)=>a+(h.value!=null?h.value:h.cost),0):0),0)}

  if(hs.length){h+=`<div class="b" style="margin-top:12px">หุ้น / กองทุน</div>`;hs.forEach(x=>{h+=row(`${esc(x.sym)} (ราคาต่อหน่วย ${x.cur})`,x.sym,x.price)})}
  openSheet(h+`<div class="btns" style="margin-top:12px"><button class="ghost" onclick="closeSheet()">ยกเลิก</button><button class="pri" onclick="savePrices()">บันทึกราคา</button></div>`)}

function monthData(ym){const[y,m]=ym.split('-').map(Number),s0=new Date(y,m-1,1),e0=new Date(y,m,1);let inc=0,exp=0;
  const R=A.map(a=>({a,open:Number(a.opening_balance),i:0,o:0})),mp={};R.forEach(r=>mp[r.a.id]=r);
  for(const t of T){const d=new Date(t.occurred_at),x=Number(t.amount);
    const ap=(id,sg)=>{const r=mp[id];if(!r)return;if(d<s0)r.open+=sg*x;else if(d<e0){if(sg>0)r.i+=x;else r.o+=x}};
    if(t.to_account_id)ap(t.to_account_id,1);if(t.from_account_id)ap(t.from_account_id,-1);
    if(d>=s0&&d<e0){if(t.txn_type==='income')inc+=x;if(t.txn_type==='expense'||t.txn_type==='card_purchase')exp+=x}}
  return{R,inc,exp,s0,e0}}

    $('xa').innerHTML='<option value="">เลือกบัญชี</option>'+Object.keys(accs).map(id=>`<option value="${id}">${esc(nm(id))} · เหลือ ${Number(accs[id].toFixed(4)).toLocaleString('th-TH')} ${c}</option>`).join('')}
  xcCalc()}
function xcCalc(){const xi=$('xi');if(!xi||!$('xc')||$('xc').value==='THB')return;const c=$('xc').value,a=$('xa').value,u=Number($('amt').value);if(!a||!(u>0)){xi.textContent='';return}
  const r=fifoSpend(a,c,u,exId());xi.textContent=r.short>0?'เงินในบัญชีนี้ไม่พอ':`เทียบเป็นเงินบาท (ต้นทุนที่แลกมา) ≈ ${fmt(r.cost)}`}
function fxTag(t){const sp=FS.filter(s=>s.txn_id===t.id);if(!sp.length)return '';const l=L.find(x=>x.id===sp[0].lot_id);return l?` · ${Number(sp.reduce((a,s)=>a+Number(s.units),0).toFixed(4)).toLocaleString('th-TH')} ${l.symbol.replace('FX:','')}`:''}
function cardRows(a){let b=Number(a.opening_balance);
  return T.filter(t=>t.from_account_id===a.id||t.to_account_id===a.id).sort((x,y)=>new Date(x.occurred_at)-new Date(y.occurred_at)).map(t=>{const x=Number(t.amount),out=t.from_account_id===a.id;b+=out?-x:x;return{t,out,x,bal:b}})}
const owe=b=>fmt(Math.max(0,-b));
const shiftYm=(ym,n)=>{const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const cardLabel=(t,out)=>t.txn_type==='card_purchase'?'รูดบัตร':out?TL[t.txn_type]:'ชำระบัตร';
function cardView(a,ym){const rows=cardRows(a);let s0=null,e0=null;if(ym){const[y,m]=ym.split('-').map(Number);s0=new Date(y,m-1,1);e0=new Date(y,m,1)}
  const view=rows.filter(r=>!ym||(new Date(r.t.occurred_at)>=s0&&new Date(r.t.occurred_at)<e0)),before=ym?rows.filter(r=>new Date(r.t.occurred_at)<s0):[];
  const start=before.length?before[before.length-1].bal:Number(a.opening_balance),end=view.length?view[view.length-1].bal:start;
  return{view,start,end,sw:view.filter(r=>r.out).reduce((c,r)=>c+r.x,0),pay:view.filter(r=>!r.out).reduce((c,r)=>c+r.x,0)}}
function openCardHist(id,ym){const a=A.find(v=>v.id===id);if(!a)return;if(ym===undefined)ym=nowLocal().slice(0,7);const v=cardView(a,ym),lim=Number(a.credit_limit||0);
  openSheet(`<h2 style="margin-top:0">ประวัติรูดบัตร · ${esc(a.nickname)}</h2>
  <label>เลือกเดือน (ล้างช่องเพื่อดูทั้งหมด)<input type="month" value="${ym}" onchange="openCardHist('${id}',this.value)"></label>
  <div class="btns" style="margin-bottom:12px">${ym?`<button class="ghost" onclick="openCardHist('${id}','${shiftYm(ym,-1)}')">◀ เดือนก่อน</button><button class="ghost" onclick="openCardHist('${id}','${shiftYm(ym,1)}')">เดือนถัดไป ▶</button>`:''}<button class="ghost" onclick="openCardHist('${id}','${ym?'':nowLocal().slice(0,7)}')">${ym?'ดูทั้งหมด':'ดูรายเดือน'}</button></div>
  <div class="card" style="margin-bottom:12px"><div class="row"><span>ค้างชำระ${ym?'ต้นช่วง':'ยกมา'}</span><b>${owe(v.start)}</b></div><div class="row"><span>รูดบัตรรวม (${v.view.filter(r=>r.out).length} รายการ)</span><b style="color:var(--neg)">${fmt(v.sw)}</b></div><div class="row"><span>ชำระรวม (${v.view.filter(r=>!r.out).length} รายการ)</span><b style="color:var(--pos)">${fmt(v.pay)}</b></div><div class="row"><span>ค้างชำระปลายช่วง</span><b>${owe(v.end)}</b></div>${lim?`<div class="row"><span>วงเงินคงเหลือ (ปัจจุบัน)</span><span>${fmt(lim-Math.max(0,-bal(a)))}</span></div>`:''}</div>
  ${v.view.length?`<div class="card">${v.view.slice().reverse().map(r=>{const t=r.t,tag=/\(งวด/.test(t.category||'')?' <span class="mut">[ผ่อน]</span>':'';
    return `<div class="row" onclick="openSlip('${t.id}')" style="cursor:pointer;align-items:flex-start"><div><div>${cardLabel(t,r.out)}${t.category?' · '+esc(t.category):''}${tag}</div><div class="mut">${fdt(t.occurred_at)}${t.owner?' · '+esc(t.owner):''}${t.note?' · '+esc(t.note):''}</div><div class="mut">ค้างชำระหลังรายการ ${owe(r.bal)}</div></div><b style="color:${r.out?'var(--neg)':'var(--pos)'};white-space:nowrap">${r.out?'-':'+'}${fmt(r.x)}</b></div>`}).join('')}</div>`:'<div class="card"><p class="mut">ไม่มีรายการในช่วงนี้</p></div>'}
  <div class="btns" style="margin-top:14px"><button class="ghost" onclick="closeSheet()">ปิด</button><button class="pri" onclick="exportCard('${id}','${ym}')">ดาวน์โหลด Excel</button></div>`)}
function exportCard(id,ym){if(!window.XLSX){alert('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');return}
  const a=A.find(v=>v.id===id),v=cardView(a,ym),d2=d=>{const x=new Date(d);return[x.toLocaleDateString('th-TH'),x.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})]};
  const rows=[[`ประวัติรูดบัตร ${a.nickname} ${ym||'(ทั้งหมด)'}`],['ค้างชำระต้นช่วง',Math.max(0,-v.start)],[],['วันที่','เวลา','ประเภท','รายละเอียด','เจ้าของ','หมายเหตุ','รูดบัตร (บาท)','ชำระ (บาท)','ค้างชำระหลังรายการ']];
  v.view.forEach(r=>{const t=r.t,[dd,tt]=d2(t.occurred_at);rows.push([dd,tt,cardLabel(t,r.out),t.category||'',t.owner||'',t.note||'',r.out?r.x:'',r.out?'':r.x,Math.max(0,-r.bal)])});
  rows.push([],['รูดบัตรรวม',v.sw],['ชำระรวม',v.pay],['ค้างชำระปลายช่วง',Math.max(0,-v.end)]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),String(a.nickname).replace(/[\[\]:*?\/\\]/g,'').slice(0,28)||'บัตร');
  XLSX.writeFile(wb,`บัตร_${a.nickname}_${ym||'ทั้งหมด'}.xlsx`)}
let HD=0;
const dayStart=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(n-1));return d};
function setHD(d){HD=d;home()}
const ymdOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function openDay(ymd){
  ymd=ymd||ymdOf(new Date());const[y,m,d]=ymd.split('-').map(Number),s0=new Date(y,m-1,d),e0=new Date(y,m-1,d+1);
  const day=T.filter(t=>{const x=new Date(t.occurred_at);return x>=s0&&x<e0}).sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at));
  let inc=0,exp=0;const mp={};
  for(const t of day){const x=Number(t.amount);if(t.txn_type==='income')inc+=x;if(t.txn_type==='expense'||t.txn_type==='card_purchase')exp+=x;
    if(t.to_account_id){const r=mp[t.to_account_id]=mp[t.to_account_id]||{i:0,o:0};r.i+=x}
    if(t.from_account_id){const r=mp[t.from_account_id]=mp[t.from_account_id]||{i:0,o:0};r.o+=x}}
  const prev=ymdOf(new Date(y,m-1,d-1)),next=ymdOf(new Date(y,m-1,d+1));
  openSheet(`<h2 style="margin-top:0">สรุปรายวัน</h2><label>เลือกวัน<input type="date" value="${ymd}" onchange="if(this.value)openDay(this.value)"></label>
  <div class="btns" style="margin-bottom:12px"><button class="ghost" onclick="openDay('${prev}')">◀ วันก่อน</button><button class="ghost" onclick="openDay('${next}')">วันถัดไป ▶</button></div>
  <div class="card" style="margin-bottom:12px"><div class="row"><span>รายรับรวม</span><b style="color:var(--pos)">${fmt(inc)}</b></div><div class="row"><span>รายจ่ายรวม (รวมรูดบัตร)</span><b style="color:var(--neg)">${fmt(exp)}</b></div><div class="row"><span>สุทธิของวัน</span><b>${fmt(inc-exp)}</b></div></div>
  <div class="mut" style="margin-bottom:4px">โอนระหว่างบัญชีและการซื้อ-ขายสินทรัพย์ลงทุนไม่นับเป็นรายรับ/รายจ่าย</div>
  ${day.length?`<h2>แยกรายบัญชี</h2><div class="card">`+Object.keys(mp).map(id=>`<div class="row"><span>${esc(nm(id))}</span><span class="mut">เข้า ${fmt(mp[id].i)} · ออก ${fmt(mp[id].o)}</span></div>`).join('')+`</div><h2>รายการของวัน</h2><div class="card">`+day.map(t=>`<div class="row"><div><div>${TL[t.txn_type]}${t.category?' · '+esc(t.category):''}</div><div class="mut">${new Date(t.occurred_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div></div><span class="b" style="color:${isIn(t)?'var(--pos)':t.txn_type==='transfer'?'var(--ink)':'var(--neg)'}">${t.txn_type==='transfer'?'':isIn(t)?'+':'-'}${fmt(t.amount)}</span></div>`).join('')+'</div>':'<p class="mut">ไม่มีรายการในวันนี้</p>'}
  <button class="ghost" style="width:100%;margin-top:14px" onclick="closeSheet()">ปิด</button>`)}
const pdY=x=>{const[y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
const diffDays=(a,b)=>Math.round((pdY(a)-pdY(b))/864e5);
function impNext(x){const today=ymdOf(new Date());if(!x.repeat_yearly)return{date:x.date_on,days:diffDays(x.date_on,today)};
  const[,m,d]=x.date_on.split('-').map(Number),mk=yy=>ymdOf(new Date(yy,m-1,Math.min(d,new Date(yy,m,0).getDate())));let o=mk(new Date().getFullYear());if(o<today)o=mk(new Date().getFullYear()+1);return{date:o,days:diffDays(o,today)}}
function notifyEntries(){const today=ymdOf(new Date()),E=[],tm=t=>t.due_time?' · '+t.due_time.slice(0,5):'';
  for(const t of TKS){if(t.done||!t.due_date)continue;const d=diffDays(t.due_date,today);
    if(d<0)E.push({d,tone:'over',title:t.title,sub:`เลยกำหนดมา ${-d} วัน${tm(t)}`});
    else if(d<=(t.remind_before||0))E.push({d,tone:d===0?'today':'soon',title:t.title,sub:(d===0?'ครบกำหนดวันนี้':`อีก ${d} วัน (${fdt2(t.due_date)})`)+tm(t)})}
  for(const i of II){if(paidItem(i))continue;const p=IP.find(x=>x.id===i.plan_id);if(!p)continue;const d=diffDays(i.due_date,today),ttl=`ผ่อน ${p.title} งวด ${i.seq}/${p.months}`,sb2=` · ${fmt(i.amount)} · ${nm(p.card_account_id)}`;
    if(d<0)E.push({d,tone:'over',title:ttl,sub:`เลยกำหนด ${-d} วัน`+sb2});else if(d<=3)E.push({d,tone:d===0?'today':'soon',title:ttl,sub:(d===0?'ครบกำหนดวันนี้':`อีก ${d} วัน`)+sb2})}
  for(const x of IMP){const n=impNext(x);if(n.days>=0&&n.days<=(x.remind_before||7))E.push({d:n.days,tone:n.days===0?'today':'soon',title:'★ '+x.title,sub:n.days===0?'วันนี้!':`อีก ${n.days} วัน (${fdt2(n.date)})`})}
  return E.sort((a,b)=>a.d-b.d)}
function notifyHTML(){const E=notifyEntries();if(!E.length)return '';const col={over:'var(--neg)',today:'var(--pri)',soon:'var(--ink)'};
  return `<div class="card" style="margin:12px 0;padding:10px 16px;border:1.5px solid var(--soft)"><div class="row" style="border:0"><b>แจ้งเตือน (${E.length})</b><a href="calendar.html" class="lk">เปิดปฏิทิน</a></div>`+
  E.slice(0,8).map(e=>`<div class="row" onclick="location.href='calendar.html'" style="cursor:pointer"><div><div style="color:${col[e.tone]};font-weight:600">${esc(e.title)}</div><div class="mut">${esc(e.sub)}</div></div></div>`).join('')+(E.length>8?`<div class="mut" style="padding:8px 0">และอีก ${E.length-8} รายการ ดูในปฏิทิน</div>`:'')+'</div>'}
function countdownHTML(){const up=IMP.map(x=>({x,n:impNext(x)})).filter(o=>o.n.days>=0).sort((a,b)=>a.n.days-b.n.days).slice(0,3);
  if(!up.length)return `<div class="mut" style="margin:8px 0"><a href="calendar.html?dates=1" class="lk">+ เพิ่มวันสำคัญ (นับถอยหลัง)</a></div>`;
  return `<div class="card" style="margin:12px 0;padding:10px 16px"><div class="row" style="border:0"><b>★ วันสำคัญ · นับถอยหลัง</b><a href="calendar.html?dates=1" class="lk">จัดการ</a></div>`+
  up.map(({x,n})=>`<div class="row"><div><div class="b">${esc(x.title)}</div><div class="mut">${fdt2(n.date)}${x.repeat_yearly?' · ทุกปี':''}</div></div><b style="color:#C98A2B;white-space:nowrap">${n.days===0?'วันนี้':'อีก '+n.days+' วัน'}</b></div>`).join('')+'</div>'}
function openMenu(){openSheet(`<h2 style="margin-top:0">เมนู</h2><button class="pri" style="width:100%;margin-bottom:10px" onclick="closeSheet()">การเงิน (หน้านี้)</button><button class="ghost" style="width:100%;margin-bottom:10px" onclick="location.href='calendar.html'">ปฏิทินและงาน</button><button class="ghost" style="width:100%;margin-bottom:10px" onclick="location.href='calendar.html?dates=1'">★ วันสำคัญ · นับถอยหลัง</button><button class="ghost" style="width:100%" onclick="closeSheet()">ปิด</button>`)}
init();
</script>
